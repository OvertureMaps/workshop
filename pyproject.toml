[project]
name = "workshop"
version = "0.1.0"
description = "Demos and tutorials for working with Overture data and GERS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "fiona>=1.9",
    "geopandas>=0.14",
    "jupyter>=1.0",
    "lonboard>=0.16.0",
    "matplotlib>=3.7",
    "notebook>=7.0",
    "numpy>=1.24",
    "overturemaps>=1.0.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pystac>=1.14.3",
    "shapely>=2.0",
]

[project.optional-dependencies]
# Optional: enables the live transportation-splitter step in
# notebooks/5-transportation-matching.ipynb. Only its pure-Python geometry
# functions are used (no Spark session is started), but the package pulls in
# pyspark/apache-sedona, so it is kept out of the default install. Enable with
# `uv sync --extra splitter` (or `pip install ".[splitter]"`).
splitter = [
    "transportation-splitter @ git+https://github.com/OvertureMaps/transportation-splitter",
]
