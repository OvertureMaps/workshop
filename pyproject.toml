[project]
name = "workshop"
version = "0.1.0"
description = "Demos and tutorials for working with Overture data and GERS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "fiona>=1.9",
    "geopandas>=0.14",
    "jupyter>=1.0",
    "lonboard>=0.16.0",
    "matplotlib>=3.7",
    "my-schema",
    "notebook>=7.0",
    "numpy>=1.24",
    "overturemaps>=1.0.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pystac>=1.14.3",
    "schema-bootstrap",
    "shapely>=2.0",
]

[tool.uv.workspace]
members = [
    "my-schema",
    "schema-bootstrap",
]

[tool.uv.sources]
my-schema = { workspace = true, editable = true }
schema-bootstrap = { workspace = true, editable = true }
# stac-table-columns output is unreleased (OvertureMaps/schema#724); install codegen from
# that branch until it ships.
overture-schema-codegen = { git = "https://github.com/OvertureMaps/schema.git", branch = "stac-table-columns", subdirectory = "packages/overture-schema-codegen" }
